<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style>
body {
	background-color: whitesmoke;
	display: flex;
	justify-content: center;
	align-items: center;
	flex-direction: column;
	line-height: 40px;
}

#h {
	color: blue;
	font-size:40px;
}

form {
	border-radius:5px;
	width: 500px;
	height: 400px;
	display: flex;
	justify-content: center;
	align-items: center;
	flex-direction: column;
	background-color: lightblue;
	font-size:20px;
	font-weight:bold;
}

button {
	margin-top: 20px;
	width: 80px;
	height: 40px;
	background-color:blue;
	color:white;
	border-radius:5px;
	border-style:none;
}
input{
width:280px;
height: 25px;
}
</style>
</head>

<body>

	<h1 id="h">SMART HOSPITAL APPOINTMENT SYSTEM</h1>
	<h1 style="color:grey; font-size:30px">Patient Registration Form</h1>
	<form action="register" method="post">
		<table>
			<tr>
				<td><label>Patient ID:</label></td>
				<td><input type="number" placeholder="Enter Patient Id" name="id"></td>
			</tr>
			<tr>
				<td><label>Patient Name:</label></td>
				<td><input type="text" placeholder="Enter Patient Name" name="name"></td>
			</tr>
			<tr>
				<td><label>Age:</label></td>
				<td><input type="number" placeholder="Enter Patient Age" name="age"></td>
			</tr>
			<tr>
				<td><label>Phone Number:</label></td>
				<td><input type="text" placeholder="Enter Phone Number" name="phone"></td>
			</tr>
			<tr>
				<td><label>Disease/Problem:</label></td>
				<td><input type="text" placeholder="Enter disease caused" name="disease"></td>
			</tr>
		</table>
		<button type="submit">Register</button>
		<h5 style="line-height:5px">Already Registered?? <a href="./appointment.html" style="color:blue">Book Appointment</a></h5>
	</form>

</body>
</html>
